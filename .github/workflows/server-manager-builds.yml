name: server-manager-builds

on:
  push:
    branches: [main]
    tags: ["codmes-server-v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Completed build workflow run ID whose artifacts should be published"
        required: false
        type: string
      release_tag:
        description: "Existing release tag to publish (for example codmes-server-v0.1.0)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.source_run_id == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: codmes-server-manager-macos
            bundles: dmg
          - os: ubuntu-24.04
            artifact: codmes-server-manager-linux
            bundles: deb
    runs-on: ${{ matrix.os }}
    env:
      CODMES_BUNDLED_GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.CODMES_GOOGLE_DESKTOP_CLIENT_ID }}
      CODMES_BUNDLED_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.CODMES_GOOGLE_DESKTOP_CLIENT_SECRET }}
      CODMES_BUNDLED_GOOGLE_MACOS_CLIENT_ID: ${{ vars.CODMES_GOOGLE_MACOS_CLIENT_ID }}
      CODMES_BUNDLED_GOOGLE_IOS_CLIENT_ID: ${{ vars.CODMES_GOOGLE_IOS_CLIENT_ID }}
      CODMES_BUNDLED_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.CODMES_GOOGLE_ANDROID_CLIENT_ID }}
      CODMES_BUNDLED_GOOGLE_WEB_CLIENT_ID: ${{ vars.CODMES_GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/server-manager/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install uv for portable Python packaging
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential bison flex
      - name: Install Server Manager dependencies
        working-directory: apps/server-manager
        run: npm ci
      - name: Require official Google login IDs for release
        if: startsWith(github.ref, 'refs/tags/codmes-server-v')
        run: node apps/server-manager/scripts/check-bundled-google-oauth.mjs --require=desktop,macos,ios,android,web
      - name: Test Server Manager
        working-directory: apps/server-manager
        run: npm run check
      - name: Build portable PostgreSQL and pgvector
        id: postgres
        shell: bash
        run: |
          output="$RUNNER_TEMP/codmes-native/postgres"
          bash apps/server-manager/scripts/build-postgres-runtime.sh "$output"
          echo "root=$output" >> "$GITHUB_OUTPUT"
      - name: Stage Codmes runtime
        working-directory: apps/server-manager
        env:
          CODMES_MANAGER_POSTGRES_ROOT: ${{ steps.postgres.outputs.root }}
        run: npm run stage:runtime -- --require-postgres
      - name: Build native bundle
        working-directory: apps/server-manager
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/server-manager/builds/rust/release/bundle/**/*.dmg
            apps/server-manager/builds/rust/release/bundle/**/*.exe
            apps/server-manager/builds/rust/release/bundle/**/*.deb
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/codmes-server-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: codmes-server-manager-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -d '' files < <(find release-assets -type f \( \
            -name '*.dmg' -o -name '*.exe' -o -name '*.deb' \
          \) -print0)
          if (( ${#files[@]} == 0 )); then
            echo "No installable bundles were produced."
            exit 1
          fi
          version="${GITHUB_REF_NAME#codmes-server-v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --verify-tag \
              --title "Codmes Server $version" \
              --generate-notes
          fi

  publish-existing-artifacts:
    if: github.event_name == 'workflow_dispatch' && inputs.source_run_id != '' && inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: codmes-server-manager-*
          path: release-assets
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Publish existing build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mapfile -d '' files < <(find release-assets -type f \( \
            -name '*.dmg' -o -name '*.exe' -o -name '*.deb' \
          \) -print0)
          if (( ${#files[@]} == 0 )); then
            echo "No installable bundles were produced."
            exit 1
          fi
          version="${RELEASE_TAG#codmes-server-v}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --verify-tag \
              --title "Codmes Server $version" \
              --generate-notes
          fi
