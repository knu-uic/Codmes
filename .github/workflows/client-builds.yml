name: client-builds

on:
  push:
  pull_request:

jobs:
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Apple client
        working-directory: apps/client/apple
        run: swift test

  android:
    runs-on: ubuntu-latest
    env:
      CODMES_GOOGLE_WEB_CLIENT_ID: ${{ vars.CODMES_GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Test and lint Android client
        working-directory: apps/client/android
        run: ./gradlew testDebugUnitTest lintDebug
      - name: Build Android package
        run: node scripts/build-client.mjs android
      - uses: actions/upload-artifact@v4
        with:
          name: codmes-android-debug
          path: apps/client/builds/android/latest/Codmes-debug.apk

  windows:
    runs-on: windows-latest
    env:
      CODMES_GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.CODMES_GOOGLE_DESKTOP_CLIENT_ID }}
      CODMES_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.CODMES_GOOGLE_DESKTOP_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test Windows compatibility contract
        run: dotnet test apps/client/windows/tests/Codmes.Windows.Tests.csproj --configuration Release
      - name: Publish Windows client
        run: node scripts/build-client.mjs windows
      - uses: actions/upload-artifact@v4
        with:
          name: codmes-windows-win-x64
          path: apps/client/builds/windows/latest
